<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Pedidos • Mesa Fácil</title>
    <link rel="icon" type="image/png" href="../assets/admin-icon.png" />

    <link rel="stylesheet" href="css/admin.css" />
    <link rel="stylesheet" href="css/pedidos.css">

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="layout">
      <!-- Sidebar -->
      <aside id="sidebar"></aside>

      <!-- Conteúdo -->

      <main class="content">
        <!-- Header -->

        <header id="header"></header>

        <section class="dashboard">
          <div class="pedidos-header">
            <div>
              <h1>Pedidos</h1>

              <p class="subtitle">Gerencie os pedidos em tempo real.</p>
            </div>
          </div>

          <div class="pedidos-filtros">
            <input
              id="buscarPedido"
              type="text"
              placeholder="Pesquisar pedido..."
            />

            <select id="filtroTipo">
              <option value="">Todos os tipos</option>

              <option value="Delivery">Delivery</option>

              <option value="Retirada">Retirada</option>

              <option value="Mesa">Mesa</option>
            </select>

            <select id="filtroStatus">
              <option value="">Todos</option>

              <option value="RECEBIDO">Recebidos</option>

              <option value="PREPARANDO">Em preparo</option>

              <option value="PRONTO">Prontos</option>

              <option value="ENTREGUE">Entregues</option>
            </select>
          </div>

          <div class="pedidos-board">
            <section class="pedidos-column" data-status="RECEBIDO">
              <div class="column-header">
                <span> Recebidos </span>

                <span id="contadorRecebidos" class="column-counter"> 0 </span>
              </div>

              <div id="colunaRecebidos" class="column-body"></div>
            </section>

            <section class="pedidos-column" data-status="PREPARANDO">
              <div class="column-header">
                <span> Em preparo </span>

                <span id="contadorPreparando" class="column-counter"> 0 </span>
              </div>

              <div id="colunaPreparando" class="column-body"></div>
            </section>

            <section class="pedidos-column" data-status="PRONTO">
              <div class="column-header">
                <span> Prontos </span>

                <span id="contadorProntos" class="column-counter"> 0 </span>
              </div>

              <div id="colunaProntos" class="column-body"></div>
            </section>

            <section class="pedidos-column" data-status="ENTREGUE">
              <div class="column-header">
                <span> Entregues </span>

                <span id="contadorEntregues" class="column-counter"> 0 </span>
              </div>

              <div id="colunaEntregues" class="column-body"></div>
            </section>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
