<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Status do Pedido</title>
    <link rel="icon" type="image/png" href="./assets/avatar.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./css/styles.css" />

    <link rel="stylesheet" href="./css/pedido-status.css" />
  </head>

  <body class="cliente-body">
    <header class="store-header">
      <div class="container py-3 py-lg-4">
        <div class="store-hero card border-0 shadow-sm">
          <div class="card-body p-4">
            <div class="d-flex align-items-center gap-3">
              <div class="store-logo">
                <img src="./assets/avatar.png" alt="Logo do restaurante" />
              </div>

              <div>
                <p class="store-kicker mb-1">Acompanhe seu pedido</p>

                <h2 class="store-title">Seus pedidos</h2>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="container py-3">
      <section>
        <div class="mb-4">
          <h2 class="section-title">Seus pedidos</h2>

          <p class="section-subtitle">
            Acompanhe o andamento do seu pedido em tempo real.
          </p>
        </div>

        <div id="pedidoAtual"></div>

        <div class="mt-4">
          <h2 class="section-title">Seus pedidos</h2>
          <p class="section-subtitle">Acompanhe seus pedidos recentes.</p>
          <div id="listaPedidos">
            <div class="status-card mb-3">Carregando...</div>
          </div>
        </div>
      </section>
    </main>

    <script type="module">
      import {
        ouvirPedidosCliente,
        ouvirPedidoPorId,
        criarSolicitacaoPedido,
        ouvirSolicitacoesPedido,
        responderSolicitacaoCliente,
      } from "./js/services/orders.js";

      import {
        garantirClienteAuth,
        buscarCliente,
        registrarNotificacoesCliente,
      } from "./js/services/customers.js";

      import {
        calcularHorarioFinalEstimativa,
        textoDiaEstimativa,
        formatarHorarioEstimativa,
      } from "./js/services/order-estimates.js";

      const pedidoAtual = document.getElementById("pedidoAtual");
      const listaPedidos = document.getElementById("listaPedidos");
      let solicitacoesAtual = [];
      let pedidoAtualEmTela = null;

      function formatarMoeda(valor) {
        return Number(valor || 0).toLocaleString("pt-BR", {
          style: "currency",
          currency: "BRL",
        });
      }

      function formatarData(data) {
        if (!data) return "—";

        if (typeof data.toDate === "function") {
          return data.toDate().toLocaleString("pt-BR");
        }

        try {
          return new Date(data).toLocaleString("pt-BR");
        } catch {
          return "—";
        }
      }

      function renderMensagem(texto) {
        pedidoAtual.innerHTML = `
      <div class="item status-card" style="display:block;">
        <p>${texto}</p>
      </div>
    `;
      }
      function getStatusLabel(status) {
        switch (status) {
          case "RECEBIDO":
            return "🟡 Recebido";

          case "PREPARANDO":
            return "👨‍🍳 Em preparo";

          case "PRONTO":
            return "✅ Pronto";

          case "SAIU_PARA_ENTREGA":
            return "🚚 Saiu para entrega";

          case "CANCELADO":
            return "❌ Cancelado";

          default:
            return status || "—";
        }
      }

      function isPix(metodo) {
        if (!metodo) return false;
        const texto = String(metodo).toLowerCase().trim();
        return texto === "pix" || texto.includes("pix");
      }

      function timestampParaDate(valor) {
        if (!valor) return null;
        if (typeof valor.toDate === "function") return valor.toDate();
        const data = new Date(valor);
        return Number.isNaN(data.getTime()) ? null : data;
      }

      function formatarHorario(valor) {
        const data = timestampParaDate(valor);
        if (!data) return "—";
        return data.toLocaleTimeString("pt-BR", {
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
        });
      }

      function escaparHtml(valor) {
        return String(valor ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function renderSolicitacoes(pedido) {
        const container = document.getElementById("solicitacoesPedido");
        if (!container) return;

        const ativas = solicitacoesAtual.filter(
          (item) => !["CANCELADA"].includes(item.status),
        );

        const pendentes = ativas.filter(
          (item) =>
            item.status === "PENDENTE" || item.status === "AGUARDANDO_CLIENTE",
        );

        const pedidoFinalizado = ["ENTREGUE", "CANCELADO"].includes(
          pedido.status,
        );

        const temPrevisao = pendentes.some(
          (item) => item.tipo === "PREVISAO_ENTREGA" || item.tipo === "ATRASO",
        );
        const temCancelamento = pendentes.some(
          (item) => item.tipo === "CANCELAMENTO",
        );

        const botoes = pedidoFinalizado
          ? ""
          : `
            <div class="d-grid gap-2 mt-3">
              ${
                !temPrevisao
                  ? `
                <button class="btn btn-outline-primary" id="btnSolicitarPrevisao" type="button">
                  🕐 Gostaria de uma previsão de entrega
                </button>
                <button class="btn btn-outline-warning" id="btnSolicitarAtraso" type="button">
                  ⚠️ Meu pedido está atrasado
                </button>
              `
                  : ""
              }
              ${
                !temCancelamento
                  ? `
                <button class="btn btn-outline-danger" id="btnSolicitarCancelamento" type="button">
                  ❌ Quero cancelar este pedido
                </button>
              `
                  : ""
              }
            </div>
          `;

        const historico = ativas.length
          ? ativas
              .map((item) => {
                const tipo =
                  item.tipo === "CANCELAMENTO"
                    ? "❌ Cancelamento"
                    : item.tipo === "ATRASO"
                      ? "⚠️ Pedido atrasado"
                      : "🕐 Nova previsão";

                let conteudo = `<p class="mb-2"><strong>${tipo}</strong></p>
                  <p class="mb-2">${escaparHtml(item.mensagem || "")}</p>`;

                if (item.status === "PENDENTE") {
                  conteudo += `<div class="alert alert-warning mb-0">Aguardando resposta do estabelecimento.</div>`;
                } else if (item.status === "AGUARDANDO_CLIENTE") {
                  conteudo += `
                    <div class="alert alert-info">
                      <strong>Nova previsão: ${formatarHorario(item.horarioProposto)}</strong><br>
                      ${item.tempoAdicionalMinutos ? `Tempo adicional: ${item.tempoAdicionalMinutos} min.<br>` : ""}
                      ${item.motivo ? `Motivo: ${escaparHtml(item.motivo)}<br>` : ""}
                      <small>Responda até ${formatarHorario(item.aceitaAte)}.</small>
                    </div>
                    <div class="d-flex gap-2">
                      <button class="btn btn-success flex-fill" type="button" data-aceitar-solicitacao="${item.id}">✅ Aceitar</button>
                      <button class="btn btn-outline-danger flex-fill" type="button" data-recusar-solicitacao="${item.id}">❌ Recusar</button>
                    </div>
                  `;
                } else if (
                  item.status === "ACEITA" ||
                  item.status === "ACEITA_TIMEOUT"
                ) {
                  const timeout = item.status === "ACEITA_TIMEOUT";
                  conteudo += `<div class="alert alert-success mb-0">${
                    timeout
                      ? "✅ O prazo terminou sem resposta e a nova previsão foi considerada aceita."
                      : "✅ Nova previsão aceita."
                  }</div>`;
                } else if (item.status === "RECUSADA") {
                  conteudo += `<div class="alert alert-secondary mb-0">❌ Solicitação recusada.</div>`;
                }

                return `<div class="border rounded p-3 mb-3">${conteudo}</div>`;
              })
              .join("")
          : "";

        container.innerHTML = `
          <div class="status-section">
            <h4>💬 Comunicação com a loja</h4>
            <p class="text-secondary">Envie uma solicitação pelo próprio acompanhamento do pedido.</p>
            ${historico}
            ${botoes}
          </div>
        `;

        async function criarSolicitacao(tipo, mensagem) {
          try {
            await criarSolicitacaoPedido(pedido.id, tipo, mensagem);
            renderSolicitacoes(pedido);
          } catch (erro) {
            console.error(erro);
            alert("Não foi possível enviar a solicitação. Tente novamente.");
          }
        }

        document
          .getElementById("btnSolicitarPrevisao")
          ?.addEventListener("click", () =>
            criarSolicitacao(
              "PREVISAO_ENTREGA",
              "Gostaria de uma previsão de entrega.",
            ),
          );

        document
          .getElementById("btnSolicitarAtraso")
          ?.addEventListener("click", () =>
            criarSolicitacao(
              "ATRASO",
              "Meu pedido está atrasado e gostaria de uma nova previsão de entrega.",
            ),
          );

        document
          .getElementById("btnSolicitarCancelamento")
          ?.addEventListener("click", () =>
            criarSolicitacao(
              "CANCELAMENTO",
              "Fiz esse pedido, poderia cancelar pra eu refazer ?",
            ),
          );

        container
          .querySelectorAll("[data-aceitar-solicitacao]")
          .forEach((botao) => {
            botao.addEventListener("click", async () => {
              try {
                await responderSolicitacaoCliente(
                  pedido.id,
                  botao.dataset.aceitarSolicitacao,
                  "ACEITA",
                );
              } catch (erro) {
                console.error(erro);
                alert("Não foi possível registrar sua resposta.");
              }
            });
          });

        container
          .querySelectorAll("[data-recusar-solicitacao]")
          .forEach((botao) => {
            botao.addEventListener("click", async () => {
              try {
                await responderSolicitacaoCliente(
                  pedido.id,
                  botao.dataset.recusarSolicitacao,
                  "RECUSADA",
                );
              } catch (erro) {
                console.error(erro);
                alert("Não foi possível registrar sua resposta.");
              }
            });
          });
      }

      function getPixHtml(pedido) {
        if (!isPix(pedido.pagamentoMetodo)) return "";

        return `
      <div class="pix-box">
        <div class="pix-pago-topo">
          <h4>Pagamento via PIX</h4>
          <span class="pix-selo">PIX disponível</span>
        </div>

        <div class="pix-grid">
          <div class="pix-linha">
            <span class="pix-label">Tipo da chave</span>
            <div class="pix-value">Celular</div>
          </div>

          <div class="pix-linha">
            <span class="pix-label">Chave PIX</span>
            <div class="pix-value">
              <span id="pixChave">(19) 99162-0881</span>
            </div>
          </div>

          <div class="pix-linha">
            <span class="pix-label">Titular</span>
            <div class="pix-value">Darci Cândido Gonçalves</div>
          </div>

          <div class="pix-linha">
            <span class="pix-label">Banco / conta</span>
            <div class="pix-value">PagSeguro</div>
          </div>
        </div>

        <button class="btn-copiar-pix" id="btnCopiarPix" type="button">
          Copiar chave PIX
        </button>

        <div class="pix-aviso">
          Após realizar o pagamento, aguarde a confirmação da loja.
        </div>
      </div>
    `;
      }

      function ativarBotaoCopiarPix() {
        const botao = document.getElementById("btnCopiarPix");
        if (!botao) return;

        const chavePix = "(19) 99162-0881";
        const telefoneComprovante = "5519992522781";

        botao.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(chavePix);

            const textoOriginal = botao.textContent;
            botao.textContent = "Chave copiada!";

            setTimeout(() => {
              botao.textContent = textoOriginal;
            }, 2000);
          } catch {
            alert(
              "Não foi possível copiar automaticamente.\n\nChave PIX: " +
                chavePix,
            );
          }
        });

        const comprovante = document.getElementById("pixComprovante");

        if (comprovante) {
          comprovante.style.cursor = "pointer";
          comprovante.title = "Clique para copiar";

          comprovante.addEventListener("click", async () => {
            try {
              await navigator.clipboard.writeText(telefoneComprovante);

              const textoOriginal = comprovante.textContent;
              comprovante.textContent = "Copiado!";

              setTimeout(() => {
                comprovante.textContent = textoOriginal;
              }, 1500);
            } catch {
              alert(
                "Telefone para envio do comprovante: " + telefoneComprovante,
              );
            }
          });
        }
      }

      function gerarProgresso(status, tipo) {
        const isRetirada = tipo === "Retirada";

        const etapas = isRetirada
          ? [
              {
                id: "RECEBIDO",
                nome: "Recebido",
                emoji: "📥",
              },
              {
                id: "PREPARANDO",
                nome: "Preparando",
                emoji: "👨‍🍳",
              },
              {
                id: "PRONTO",
                nome: "Pronto",
                emoji: "✅",
              },
            ]
          : [
              {
                id: "RECEBIDO",
                nome: "Recebido",
                emoji: "📥",
              },
              {
                id: "PREPARANDO",
                nome: "Preparando",
                emoji: "👨‍🍳",
              },
              {
                id: "PRONTO",
                nome: "Pronto",
                emoji: "✅",
              },
              {
                id: "SAIU_PARA_ENTREGA",
                nome: "Saiu para entrega",
                emoji: "🚚",
              },
            ];

        const indiceAtual = etapas.findIndex((etapa) => etapa.id === status);

        const porcentagem =
          indiceAtual < 0 ? 0 : (indiceAtual / (etapas.length - 1)) * 100;

        return `
        <div class="status-progresso">

          <div class="progresso-linha"></div>

          <div
            class="progresso-linha-ativa"
            style="--progresso:${porcentagem}"
          ></div>

          <div class="progresso-etapas">

            ${etapas
              .map((etapa, index) => {
                let classe = "";

                if (index < indiceAtual) {
                  classe = "concluida";
                }

                if (index === indiceAtual) {
                  classe = "ativa";
                }

                return `
                  <div
                    class="progresso-etapa ${classe}"
                  >
                    <div class="progresso-bolinha">
                      ${etapa.emoji}
                    </div>

                    <span>
                      ${etapa.nome}
                    </span>
                  </div>
                `;
              })
              .join("")}

          </div>
        </div>
      `;
      }

      function gerarMensagemWhatsappPedido(pedido, pedidoId) {
        const itens = (pedido.itens || [])
          .map((item) => {
            const adicionais = (item.adicionais || [])
              .map((a) => ` + ${a.nome}`)
              .join("");

            return `${item.quantidade || 1}x ${item.nome}${adicionais}`;
          })
          .join("\n");

        const endereco = pedido.endereco || {};

        const linkStatusPedido = `https://marinilanches.vercel.app/status.html?id=${pedidoId}`;

        let mensagem = `*Pedido feito pelo Lanches Marini*

      Pedido nº *${pedido.numeroPedido || pedidoId}*

      ${itens}

      *Subtotal*: ${formatarMoeda(pedido.valorSubtotal)}
      *Frete*: ${formatarMoeda(pedido.taxaEntrega)}
      *Total*: ${formatarMoeda(pedido.valorTotal)}

      *Observações*:
      ${pedido.observacoes || "Nenhuma"}

      *Nome*: ${pedido.cliente || ""}
      *Telefone*: ${pedido.telefone || ""}
      *Tipo*: ${pedido.tipo || ""}`;

        if (pedido.tipo === "Delivery") {
          mensagem += `

      *Endereço*: ${endereco.rua || ""}, ${endereco.numero || ""} - ${
        endereco.bairro || pedido.bairro || ""
      } - ${endereco.cidade || ""}`;
        }

        mensagem += `

      *Forma de Pagamento*: ${pedido.pagamentoMetodo || ""}

      *Obrigado pela preferência*

      Confira aqui o andamento do seu pedido:
      ${linkStatusPedido}`;

        return mensagem;
      }

      function gerarComprovanteWhatsappHtml(pedido, pedidoId) {
        const mensagem = encodeURIComponent(
          gerarMensagemWhatsappPedido(pedido, pedidoId).replace(/^ +/gm, ""),
        );

        const telefone = "5519992522781";

        return `
        <div class="comprovante-box">

          <h4>📲 Enviar comprovante</h4>

          <p>
            Envie seu comprovante pelo WhatsApp:
          </p>

          <a
            href="https://wa.me/${telefone}?text=${mensagem}"
            target="_blank"
            rel="noopener noreferrer"
            class="comprovante-whatsapp"
          >
            WhatsApp (19) 99252-2781
          </a>

        </div>
        `;
      }

      function renderPedido(pedido, pedidoId) {
        const itens = Array.isArray(pedido.itens) ? pedido.itens : [];

        const itensHtml = itens.length
          ? itens
              .map((item) => {
                const quantidade = Number(item.quantidade || 1);
                const valorUnitario = Number(
                  item.valorUnitario || item.preco || 0,
                );
                const subtotal = Number(
                  item.subtotal || quantidade * valorUnitario,
                );

                const adicionais = (item.adicionais || [])
                  .map((a) => `${a.nome} (+${formatarMoeda(a.preco)})`)
                  .join("<br>");

                return `
            <div class="status-item-linha">

              <strong>${quantidade}x ${item.nome || "Item"}</strong>

              <div>Unitário: ${formatarMoeda(valorUnitario)}</div>

              <div>Subtotal: ${formatarMoeda(subtotal)}</div>

              ${
                adicionais
                  ? `
                  <div class="mt-2">
                    <strong>Adicionais:</strong><br>
                    ${adicionais}
                  </div>
                  `
                  : ""
              }

              ${
                item.observacaoItem
                  ? `
                  <div class="mt-2">
                    <strong>Obs:</strong><br>
                    ${item.observacaoItem}
                  </div>
                  `
                  : ""
              }

            </div>
          `;
              })
              .join("")
          : "<p>Nenhum item.</p>";

        const isDelivery = pedido.tipo === "Delivery";
        const estimativaTempo = pedido.estimativaTempo;

        let blocoEstimativa = "";

        if (
          estimativaTempo &&
          Number.isFinite(Number(estimativaTempo.maximo))
        ) {
          const criadoEm =
            typeof pedido.criadoEm?.toDate === "function"
              ? pedido.criadoEm.toDate()
              : new Date(pedido.criadoEm);

          const base =
            criadoEm instanceof Date && !Number.isNaN(criadoEm.getTime())
              ? criadoEm
              : new Date();

          const horarioFinal = calcularHorarioFinalEstimativa(
            estimativaTempo,
            base,
          );

          const dia = textoDiaEstimativa(horarioFinal, new Date());

          const horario = formatarHorarioEstimativa(horarioFinal);

          const retirada = pedido.tipo === "Retirada";

          blocoEstimativa = `
          <div class="status-section">
            <h4>
              ${retirada ? "🛍️ Retirada" : "🚚 Entrega"}
            </h4>

            <p>
              <strong>${dia}</strong>
            </p>

            <p>
              <strong>
                ${estimativaTempo.minimo}–${estimativaTempo.maximo} min
              </strong>
            </p>

            <p>
              ${retirada ? "Pronto para retirar até" : "Chegará até"}
              <strong>${horario}</strong>
            </p>
          </div>
        `;
        }
        let blocoNovaPrevisao = "";

        if (pedido.previsaoEntrega?.horario) {
          const resposta = pedido.previsaoEntrega.resposta;
          const aceita = resposta === "ACEITA" || resposta === "ACEITA_TIMEOUT";
          const recusada = resposta === "RECUSADA";
          const titulo = aceita
            ? "✅ Nova previsão aceita"
            : recusada
              ? "❌ Nova previsão recusada"
              : "🕐 Nova previsão proposta";

          blocoNovaPrevisao = `
            <div class="status-section">
              <h4>${titulo}</h4>
              <p>
                <strong>${formatarHorario(pedido.previsaoEntrega.horario)}</strong>
              </p>
              ${
                aceita
                  ? `
                <p class="mb-0">
                  Envie o pedido até
                  <strong>${formatarHorario(pedido.previsaoEntrega.prazoFinal)}</strong>.
                </p>
              `
                  : ""
              }
              ${
                !aceita && !recusada && pedido.previsaoEntrega.aceitaAte
                  ? `
                <p class="mb-0">
                  Responda até
                  <strong>${formatarHorario(pedido.previsaoEntrega.aceitaAte)}</strong>.
                </p>
              `
                  : ""
              }
              ${
                pedido.previsaoEntrega.motivo
                  ? `
                <p class="mb-0 mt-2">
                  <strong>Motivo:</strong> ${escaparHtml(pedido.previsaoEntrega.motivo)}
                </p>
              `
                  : ""
              }
            </div>
          `;
        }

        const blocoPix = getPixHtml(pedido);

        const endereco = pedido.endereco || {};

        const blocoComprovanteWhatsapp =
          pedido.status === "RECEBIDO"
            ? gerarComprovanteWhatsappHtml(pedido, pedidoId)
            : "";

        const enderecoTexto = [endereco.rua, endereco.numero]
          .filter(Boolean)
          .join(", ");

        const complementoTexto = endereco.complemento
          ? ` - ${endereco.complemento}`
          : "";

        const blocoEntrega = isDelivery
          ? `
            <div class="status-section">
              <h4>Entrega</h4>

              <p>
                <strong>Bairro:</strong>
                ${pedido.bairro || endereco.bairro || "—"}
              </p>

              <p>
                <strong>Endereço:</strong>
                ${enderecoTexto || "—"}${complementoTexto}
              </p>

              <p>
                <strong>Referência:</strong>
                ${pedido.referencia || "—"}
              </p>

            </div>
          `
          : "";

        pedidoAtual.innerHTML = `
      <div class="item status-card" style="display:block;">
        <h3>Pedido #${pedido.numeroPedido || pedidoId}</h3>

        ${gerarProgresso(pedido.status, pedido.tipo)}

        ${blocoEstimativa}
        ${blocoNovaPrevisao}

        <p>
          <strong>Status:</strong>
          ${getStatusLabel(pedido.status)}
        </p>

        <p><strong>Data:</strong> ${formatarData(pedido.criadoEm || pedido.createdAt)}</p>

        <div class="status-section">
          <h4>Cliente</h4>
          <p><strong>Nome:</strong> ${pedido.cliente || "—"}</p>
          <p><strong>Telefone:</strong> ${pedido.telefone || pedido.telefoneWhatsapp || "—"}</p>
          <p><strong>Tipo:</strong> ${pedido.tipo || "—"}</p>
        </div>

        <div class="status-section">
          <h4>Pagamento</h4>
          <p><strong>Método:</strong> ${pedido.pagamentoMetodo || "—"}</p>
          <p><strong>Status do pagamento:</strong> ${pedido.pagamentoStatus || "—"}</p>
        </div>

        ${blocoPix}
        ${blocoEntrega}
        ${blocoComprovanteWhatsapp}
        <div id="solicitacoesPedido"></div>

        <div class="status-section">
          <h4>Observações</h4>
          <p>${pedido.observacoes || "—"}</p>
        </div>

        <div class="status-section">
          <h4>Itens</h4>
          ${itensHtml}
        </div>

        <div class="status-section">
          <h4>Resumo</h4>
          <p><strong>Subtotal:</strong> ${formatarMoeda(pedido.valorSubtotal)}</p>
          <p><strong>Taxa de entrega:</strong> ${formatarMoeda(pedido.taxaEntrega)}</p>
          <p><strong>Total:</strong> ${formatarMoeda(pedido.valorTotal)}</p>
        </div>
      </div>
    `;

        pedidoAtualEmTela = pedido;
        ativarBotaoCopiarPix();
        renderSolicitacoes(pedido);
      }

      function renderListaPedidos(pedidos, cliente) {
        if (!pedidos.length) {
          listaPedidos.innerHTML = `
        <div class="status-card mb-3">
          <h3>Olá ${cliente?.nome || "cliente"} 👋</h3>
          <p>Nenhum outro pedido encontrado.</p>
        </div>

        <button
          class="btn btn-danger w-100 mt-3"
          onclick="location.href='./index.html'"
        >
          Novo pedido
        </button>
      `;
          return;
        }

        listaPedidos.innerHTML = `
      <h3>Olá ${cliente?.nome || "cliente"} 👋</h3>

      ${pedidos
        .map(
          (p) => `
        <div class="status-card mb-3">
          <h4>#${p.numeroPedido || p.id.slice(0, 6).toUpperCase()}</h4>

          <p>
          ${(p.itens || [])
            .map((i) => {
              const adicionais = (i.adicionais || [])
                .map((a) => a.nome)
                .join(", ");

              return `
                  <strong>${i.quantidade || 1}x ${i.nome}</strong>

                  ${
                    adicionais
                      ? `<br><small><strong>Adicionais:</strong> ${adicionais}</small>`
                      : ""
                  }

                  ${
                    i.observacaoItem
                      ? `<br><small><strong>Obs:</strong> ${i.observacaoItem}</small>`
                      : ""
                  }
              `;
            })
            .join("<hr>")}
          </p>

          <p><strong>Total:</strong> ${formatarMoeda(p.valorTotal)}</p>
          <p><strong>Status:</strong> ${getStatusLabel(p.status)}</p>

          ${gerarProgresso(p.status, p.tipo)}

          <button
            class="btn btn-outline-danger mt-3"
            onclick="location.href='./status.html?id=${p.id}'"
          >
            Ver detalhes
          </button>
        </div>
      `,
        )
        .join("")}

      <button
        class="btn btn-danger w-100 mt-3"
        onclick="location.href='./index.html'"
      >
        Novo pedido
      </button>
    `;
      }

      async function carregarStatus() {
        const params = new URLSearchParams(window.location.search);
        const pedidoId = params.get("id");

        await garantirClienteAuth();

        const cliente = await buscarCliente();

        registrarNotificacoesCliente().catch((erro) =>
          console.warn("Notificações do cliente indisponíveis:", erro),
        );

        // Mostra o pedido atual no topo, se vier ?id=
        if (pedidoId) {
          ouvirPedidoPorId(
            pedidoId,
            (pedido) => {
              renderPedido(pedido, pedidoId);
            },
            () => {
              renderMensagem("Pedido não encontrado.");
            },
          );

          ouvirSolicitacoesPedido(pedidoId, (solicitacoes) => {
            solicitacoesAtual = solicitacoes;
            if (pedidoAtualEmTela?.id === pedidoId) {
              renderSolicitacoes(pedidoAtualEmTela);
            }
          });
        } else {
          pedidoAtual.innerHTML = "";
          solicitacoesAtual = [];
          pedidoAtualEmTela = null;
        }

        // Lista os demais pedidos, sem duplicar o que já está no topo
        ouvirPedidosCliente((pedidos) => {
          const pedidosFiltrados = pedidoId
            ? pedidos.filter((p) => p.id !== pedidoId)
            : pedidos;

          renderListaPedidos(pedidosFiltrados, cliente);
        });
      }

      carregarStatus();
    </script>
